# TalkTranslate Spring Boot Application Configuration
spring.application.name=TalkTranslate
server.port=${PORT:8080}

# MySQL Database Environment Variables (Injected via .env / OS env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}

# Spring Boot Actuator Configuration (Health & Metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT / Security Configuration from Environment Variables
talktranslate.jwt.secret=${JWT_SECRET}
talktranslate.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Thread Pool Configuration
spring.task.execution.pool.core-size=${THREAD_POOL_CORE:4}
spring.task.execution.pool.max-size=${THREAD_POOL_MAX:16}
spring.task.execution.pool.queue-capacity=${THREAD_POOL_QUEUE:100}

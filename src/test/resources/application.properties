# TalkTranslate Test Configuration (In-Memory H2 Database)
spring.application.name=TalkTranslate-Test
server.port=-1

# H2 In-Memory Database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:talktranslate_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT Test Configuration
talktranslate.jwt.secret=TalkTranslate_SuperSecretSecurityKey_2026_MultilingualChat_ProductionKey
talktranslate.jwt.expiration-ms=86400000

# Thread Pool
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50

# TalkTranslate Test Configuration (Environment configurable with safe in-memory defaults)
spring.application.name=TalkTranslate-Test
server.port=${TEST_SERVER_PORT:-1}

# H2 In-Memory Database (Defaults to in-memory H2; Overridable via TEST_DB_URL)
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:talktranslate_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}

# Hibernate / JPA Configuration for Tests
spring.jpa.database-platform=${TEST_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL:create-drop}
spring.jpa.show-sql=${TEST_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT Test Configuration
talktranslate.jwt.secret=${TEST_JWT_SECRET:TestSecretKeyForAutomatedTestsOnly_NoProductionUse_2026}
talktranslate.jwt.expiration-ms=${TEST_JWT_EXPIRATION_MS:86400000}

# Thread Pool
spring.task.execution.pool.core-size=${TEST_THREAD_POOL_CORE:2}
spring.task.execution.pool.max-size=${TEST_THREAD_POOL_MAX:4}
spring.task.execution.pool.queue-capacity=${TEST_THREAD_POOL_QUEUE:50}
